<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recommended Data Sources</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: "Segoe UI", Arial, Helvetica, sans-serif;

      color: #1f2d3d;
      background: #f5f7fa;
    }

    /* ------------------------------
       Header
    ------------------------------ */

    header {
      background: linear-gradient(
        135deg,
        #0f2742,
        #173d63
      );

      color: white;

      padding: 70px 20px 55px;

      text-align: center;

      border-bottom: 5px solid #2f7d8c;
    }

    .badge {
      display: inline-block;

      margin-bottom: 18px;
      padding: 7px 15px;

      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;

      color: #d9edf4;

      font-size: 0.78rem;
      font-weight: 700;

      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    header h1 {
      margin: 0;

      font-family: Georgia, "Times New Roman", serif;

      font-size: clamp(2.5rem, 6vw, 4.3rem);

      font-weight: 700;

      letter-spacing: -1px;
    }

    header p {
      max-width: 780px;

      margin: 20px auto 0;

      color: #d9e4ee;

      font-size: 1.05rem;

      line-height: 1.8;
    }

    /* ------------------------------
       Search
    ------------------------------ */

    .search-wrapper {
      max-width: 680px;

      margin: 35px auto 0;

      background: white;

      padding: 5px;

      border-radius: 7px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.18);
    }

    #search {
      width: 100%;

      padding: 15px 18px;

      border: 1px solid #ccd6df;
      border-radius: 5px;

      outline: none;

      background: white;

      color: #25364a;

      font-size: 1rem;
    }

    #search:focus {
      border-color: #2f7d8c;

      box-shadow:
        0 0 0 3px rgba(47, 125, 140, 0.12);
    }

    #search::placeholder {
      color: #8997a5;
    }

    /* ------------------------------
       Main page
    ------------------------------ */

    main {
      width: min(1120px, 92%);

      margin: 55px auto 80px;
    }

    section {
      margin-bottom: 55px;
    }

    .section-title {
      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 20px;

      padding-bottom: 10px;

      border-bottom: 2px solid #cfd8e2;
    }

    .section-icon {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 38px;
      height: 38px;

      border-radius: 4px;

      background: #e3edf2;

      color: #24586b;

      font-weight: bold;
    }

    h2 {
      margin: 0;

      font-family: Georgia, "Times New Roman", serif;

      color: #173d63;

      font-size: 1.5rem;
    }

    /* ------------------------------
       Resource cards
    ------------------------------ */

    .resource-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(270px, 1fr));

      gap: 20px;
    }

    .resource {
      position: relative;

      padding: 24px;

      background: #ffffff;

      border: 1px solid #d8e0e7;

      border-radius: 6px;

      box-shadow:
        0 4px 14px rgba(30, 50, 70, 0.07);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .resource::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 4px;

      background: #2f7d8c;

      border-radius: 6px 6px 0 0;

      opacity: 0;

      transition: opacity 0.2s ease;
    }

    .resource:hover {
      transform: translateY(-4px);

      border-color: #b8c8d5;

      box-shadow:
        0 9px 22px rgba(30, 50, 70, 0.12);
    }

    .resource:hover::before {
      opacity: 1;
    }

    .resource h3 {
      margin: 0 0 10px;

      color: #173d63;

      font-size: 1.08rem;
    }

    .resource p {
      min-height: 75px;

      margin: 0 0 20px;

      color: #5d6b78;

      font-size: 0.94rem;

      line-height: 1.65;
    }

    /* ------------------------------
       Links / Buttons
    ------------------------------ */

    .resource a {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding: 9px 14px;

      border-radius: 4px;

      background: #173d63;

      color: #ffffff;

      font-size: 0.88rem;
      font-weight: 600;

      text-decoration: none;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .resource a:hover {
      background: #2f7d8c;

      transform: translateY(-1px);
    }

    .resource a::after {
      content: "↗";
    }

    /* ------------------------------
       Search no results
    ------------------------------ */

    #no-results {
      display: none;

      padding: 45px;

      text-align: center;

      color: #667788;

      font-size: 1.05rem;
    }
